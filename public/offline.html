<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f8ef" />
    <title>You're offline | AgriConnect</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        --bg: #f3f8ef;
        --card: #ffffff;
        --text: #142016;
        --muted: #5c6f62;
        --brand: #2e7d32;
        --brand-hover: #256628;
        --line: #d5e4d4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 28px 24px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        text-align: center;
        box-shadow: 0 10px 30px rgba(23, 60, 44, 0.08);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 1.375rem;
        line-height: 1.3;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      button {
        margin-top: 22px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover {
        background: var(--brand-hover);
      }
      button:disabled {
        opacity: 0.7;
        cursor: progress;
      }
      .status {
        margin-top: 12px;
        min-height: 1.4em;
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        AgriConnect needs an internet connection to load products, carts, and orders. Your cart
        and orders are saved and will be here when you reconnect.
      </p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      ;(function () {
        var button = document.getElementById('retry')
        var status = document.getElementById('status')
        function retry() {
          button.disabled = true
          status.textContent = 'Checking your connection…'
          // Reload the page the person was trying to open (this file is served in its place).
          window.location.reload()
        }
        button.addEventListener('click', retry)
        window.addEventListener('online', retry)
        if (!navigator.onLine) status.textContent = 'No connection detected.'
      })()
    </script>
  </body>
</html>
